name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create app files
        run: |
          set -e
          mkdir -p app/src/main/java/com/jayhacks/studio app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi
          cat > settings.gradle <<'JAYEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "JayhacksStudio"
          include ':app'
          JAYEOF
          cat > build.gradle <<'JAYEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          JAYEOF
          cat > gradle.properties <<'JAYEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          JAYEOF
          cat > app/build.gradle <<'JAYEOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jayhacks.studio'
              compileSdk 34

              defaultConfig {
                  applicationId "com.jayhacks.studio"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          JAYEOF
          cat > app/src/main/AndroidManifest.xml <<'JAYEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          JAYEOF
          cat > app/src/main/java/com/jayhacks/studio/MainActivity.java <<'JAYEOF'
          package com.jayhacks.studio;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.MimeTypeMap;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.CookieManager;
          import android.widget.Toast;

          import java.io.OutputStream;

          public class MainActivity extends Activity {

              private static final String START_URL = "https://jayhack-studio.ai.studio";
              private static final int REQ_AUDIO = 101;
              private static final int REQ_FILE = 102;

              private WebView webView;
              private PermissionRequest pendingPermission;
              private ValueCallback<Uri[]> filePathCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) { }
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              String html = "<html><body style='background:#0B0B0F;color:#fff;font-family:sans-serif;"
                                      + "display:flex;flex-direction:column;align-items:center;justify-content:center;"
                                      + "height:100vh;margin:0;text-align:center'>"
                                      + "<h2>No connection</h2><p>Check your internet and try again.</p>"
                                      + "<button style='padding:12px 28px;border:0;border-radius:8px;background:#7C5CFF;"
                                      + "color:#fff;font-size:16px' onclick=\"location.href='" + START_URL + "'\">Retry</button>"
                                      + "</body></html>";
                              view.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              boolean wantsAudio = false;
                              for (String r : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) wantsAudio = true;
                              }
                              if (!wantsAudio) {
                                  request.deny();
                                  return;
                              }
                              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                              } else {
                                  pendingPermission = request;
                                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_AUDIO);
                              }
                          });
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  // Handle downloads (http links, blob: URLs and data: URLs)
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      if (url.startsWith("blob:")) {
                          String js = "(function(){var x=new XMLHttpRequest();x.open('GET','" + url + "',true);"
                                  + "x.responseType='blob';x.onload=function(){var r=new FileReader();"
                                  + "r.onloadend=function(){AndroidBridge.saveFile(r.result,x.response.type||'application/octet-stream');};"
                                  + "r.readAsDataURL(x.response);};x.send();})();";
                          webView.evaluateJavascript(js, null);
                      } else if (url.startsWith("data:")) {
                          String mime = mimeType != null ? mimeType : "application/octet-stream";
                          new Bridge().saveFile(url, mime);
                      } else {
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          } catch (Exception ignored) { }
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(START_URL);
                  }
              }

              /** Lets the web page's blob/data downloads be saved to the Downloads folder. */
              private class Bridge {
                  @JavascriptInterface
                  public void saveFile(String dataUrl, String mime) {
                      try {
                          String b64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
                          byte[] bytes = Base64.decode(b64, Base64.DEFAULT);
                          String ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mime);
                          if (ext == null) ext = "bin";
                          String name = "jayhacks_" + System.currentTimeMillis() + "." + ext;

                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          v.put(MediaStore.Downloads.MIME_TYPE, mime);
                          v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          OutputStream out = getContentResolver().openOutputStream(uri);
                          out.write(bytes);
                          out.close();
                          toast("Saved to Downloads: " + name);
                      } catch (Exception e) {
                          toast("Download failed");
                      }
                  }
              }

              private void toast(final String msg) {
                  runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show());
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_AUDIO && pendingPermission != null) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          pendingPermission.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                      } else {
                          pendingPermission.deny();
                      }
                      pendingPermission = null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FILE && filePathCallback != null) {
                      filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      filePathCallback = null;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  CookieManager.getInstance().flush();
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAYEOF
          cat > app/src/main/res/values/strings.xml <<'JAYEOF'
          <resources>
              <string name="app_name">JAYHACKS STUDIO</string>
          </resources>
          JAYEOF
          cat > app/src/main/res/values/colors.xml <<'JAYEOF'
          <resources>
              <color name="bg_dark">#0B0B0F</color>
              <color name="accent">#7C5CFF</color>
          </resources>
          JAYEOF
          cat > app/src/main/res/values/themes.xml <<'JAYEOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:statusBarColor">@color/bg_dark</item>
                  <item name="android:navigationBarColor">@color/bg_dark</item>
                  <item name="android:windowBackground">@color/bg_dark</item>
              </style>
          </resources>
          JAYEOF
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'JAYEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#7C5CFF"
                  android:pathData="M54,32 a9,9 0 0 1 9,9 v14 a9,9 0 0 1 -18,0 v-14 a9,9 0 0 1 9,-9 z" />
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="3"
                  android:strokeLineCap="round"
                  android:pathData="M40,53 a14,14 0 0 0 28,0 M54,67 v10 M46,77 h16" />
          </vector>
          JAYEOF
          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'JAYEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg_dark" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          JAYEOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JayhacksStudio-apk
          path: app/build/outputs/apk/debug/app-debug.apk
